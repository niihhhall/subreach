[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reddit-outreach"
version = "0.1.0"
description = "Multi-agent Reddit outreach pipeline built on top of Agent-Reach"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
supabase = ["psycopg[binary]>=3.1"]   # enables the Supabase/Postgres backend

[project.scripts]
reddit-outreach = "reddit_outreach.cli:main"

[tool.setuptools.packages.find]
include = ["reddit_outreach*"]
